name = "chibby Pipeline"

[[stages]]
name = "install"
commands = ["npm install"]
backend = "local"
fail_fast = true

[[stages]]
name = "type-check"
commands = ["npm run type-check"]
backend = "local"
fail_fast = true

[[stages]]
name = "lint"
commands = ["npm run lint"]
backend = "local"
fail_fast = true

[[stages]]
name = "format-check"
commands = ["npm run format:check"]
backend = "local"
fail_fast = true

[[stages]]
name = "test"
commands = ["npm run test:run"]
backend = "local"
fail_fast = true

[[stages]]
name = "test-all"
commands = ["npm run test:all"]
backend = "local"
fail_fast = true

[[stages]]
name = "build"
commands = ["npm run build"]
backend = "local"
fail_fast = true

[[stages]]
name = "security-secrets"
commands = ["chibby scan secrets"]
backend = "local"
fail_fast = true

[[stages]]
name = "security-deps"
commands = ["chibby scan deps"]
backend = "local"
fail_fast = true

[[stages]]
name = "security-license"
commands = ["chibby scan license"]
backend = "local"
fail_fast = true

[[stages]]
name = "security-commit-lint"
commands = ["chibby scan commits"]
backend = "local"
fail_fast = true
