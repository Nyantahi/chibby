name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.id }}
      tag_name: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      # Fail fast (before any draft release is created) if the pushed tag doesn't
      # match every internal version source. Prevents mis-versioned artifacts and
      # broken Homebrew naming. Run scripts/bump.sh to keep all four in sync.
      - name: Verify tag matches version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          pkg="$(jq -r .version package.json)"
          lock="$(jq -r .version package-lock.json)"
          conf="$(jq -r .version src-tauri/tauri.conf.json)"
          cargo="$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/version *= *"([^"]+)".*/\1/')"
          echo "tag=$VERSION package.json=$pkg lock=$lock tauri.conf=$conf Cargo.toml=$cargo"
          fail=0
          for entry in "package.json:$pkg" "package-lock.json:$lock" "tauri.conf.json:$conf" "Cargo.toml:$cargo"; do
            name="${entry%%:*}"; val="${entry#*:}"
            if [ "$val" != "$VERSION" ]; then
              echo "::error::$name version ($val) does not match tag ($VERSION)"; fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "Bump every version file to match the tag (scripts/bump.sh) before releasing."
            exit 1
          fi

      - name: Create GitHub Release
        id: create
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Chibby ${{ github.ref_name }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true

  build:
    name: Build (${{ matrix.platform }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - platform: macos-x86_64
            os: macos-13
            target: x86_64-apple-darwin
            bundles: dmg
          - platform: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - platform: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: contains(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build CLI binary
        run: |
          cd src-tauri
          cargo build --features cli --bin chibby-cli --release --target ${{ matrix.target }}

      # Tauri's DMG bundler shells out to create-dmg, which isn't preinstalled
      # on GitHub's macOS runners. Without it, --bundles dmg fails.
      - name: Install create-dmg (macOS)
        if: contains(matrix.os, 'macos')
        run: brew install create-dmg

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS code signing / notarization is intentionally left OFF: the app
          # builds unsigned. Passing EMPTY APPLE_* vars (unset secrets) makes Tauri
          # attempt `security import` on an empty certificate and fail the whole
          # bundle. To enable signing, set these repo secrets and uncomment:
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: .
          tagName: ${{ github.ref_name }}
          releaseName: Chibby ${{ github.ref_name }}
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Copy CLI into macOS app bundle
        if: contains(matrix.platform, 'macos')
        run: |
          APP_PATH=$(find src-tauri/target/${{ matrix.target }}/release/bundle -name "*.app" -type d | head -1)
          if [ -n "$APP_PATH" ]; then
            cp src-tauri/target/${{ matrix.target }}/release/chibby-cli "$APP_PATH/Contents/MacOS/"
            chmod +x "$APP_PATH/Contents/MacOS/chibby-cli"
          fi

      - name: Package standalone CLI
        run: |
          mkdir -p cli-dist
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp src-tauri/target/${{ matrix.target }}/release/chibby-cli.exe cli-dist/
            cd cli-dist && zip chibby-cli-${{ matrix.platform }}.zip chibby-cli.exe
          else
            cp src-tauri/target/${{ matrix.target }}/release/chibby-cli cli-dist/
            cd cli-dist && tar -czvf chibby-cli-${{ matrix.platform }}.tar.gz chibby-cli
          fi

      - name: Upload CLI to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            cli-dist/chibby-cli-*.tar.gz
            cli-dist/chibby-cli-*.zip

  # Create universal macOS CLI binary
  macos-universal-cli:
    name: macOS Universal CLI
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build CLI for both architectures
        working-directory: src-tauri
        run: |
          cargo build --features cli --bin chibby-cli --release --target aarch64-apple-darwin
          cargo build --features cli --bin chibby-cli --release --target x86_64-apple-darwin

      - name: Create universal binary
        run: |
          mkdir -p cli-dist
          lipo -create \
            src-tauri/target/aarch64-apple-darwin/release/chibby-cli \
            src-tauri/target/x86_64-apple-darwin/release/chibby-cli \
            -output cli-dist/chibby-cli
          chmod +x cli-dist/chibby-cli
          cd cli-dist && tar -czvf chibby-cli-macos-universal.tar.gz chibby-cli

      - name: Upload universal CLI
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: cli-dist/chibby-cli-macos-universal.tar.gz

  publish-release:
    name: Publish Release
    needs: [create-release, build, macos-universal-cli]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false
            });

  # Regenerate the Homebrew formulas from the templates in packaging/homebrew/,
  # fill in the release version + real SHA256s, and push them to the tap repo.
  # Prerequisites (one-time): create the tap repo Nyantahi/homebrew-chibby with
  # Formula/ + Casks/ dirs, and add a HOMEBREW_TAP_TOKEN secret (a PAT with write
  # access to that repo). Without the secret this job self-skips.
  update-homebrew:
    name: Update Homebrew Tap
    needs: [publish-release]
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Gate on tap token
        id: gate
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -n "$TAP_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::HOMEBREW_TAP_TOKEN not set — skipping Homebrew tap update."
          fi

      - name: Check out chibby (formula templates)
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v7
        with:
          path: chibby

      - name: Check out tap repo
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v7
        with:
          repository: Nyantahi/homebrew-chibby
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Regenerate and push formulas
        if: steps.gate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          dl="$(mktemp -d)"

          # sha256 of a named release asset, or empty if the asset is absent.
          asset_sha() {
            local name="$1"
            if gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
                 --pattern "$name" --dir "$dl" --clobber >/dev/null 2>&1; then
              sha256sum "$dl/$name" | awk '{print $1}'
            fi
          }

          CLI_MACOS_SHA="$(asset_sha "chibby-cli-macos-universal.tar.gz")"
          CLI_LINUX_SHA="$(asset_sha "chibby-cli-linux-x86_64.tar.gz")"
          DMG_ARM_SHA="$(asset_sha "Chibby_${VERSION}_aarch64.dmg")"
          DMG_X64_SHA="$(asset_sha "Chibby_${VERSION}_x64.dmg")"

          # CLI formula — always updated (its assets exist on every release).
          if [ -z "$CLI_MACOS_SHA" ] || [ -z "$CLI_LINUX_SHA" ]; then
            echo "::error::Missing CLI release assets for $TAG"; exit 1
          fi
          mkdir -p tap/Formula
          sed -e "s/version \"[^\"]*\"/version \"${VERSION}\"/" \
              -e "s/PLACEHOLDER_MACOS_SHA256/${CLI_MACOS_SHA}/" \
              -e "s/PLACEHOLDER_LINUX_X64_SHA256/${CLI_LINUX_SHA}/" \
              chibby/packaging/homebrew/chibby-cli.rb > tap/Formula/chibby-cli.rb

          # Cask — only when the macOS DMGs are present in the release.
          if [ -n "$DMG_ARM_SHA" ] && [ -n "$DMG_X64_SHA" ]; then
            mkdir -p tap/Casks
            sed -e "s/version \"[^\"]*\"/version \"${VERSION}\"/" \
                -e "s/PLACEHOLDER_ARM64_SHA256/${DMG_ARM_SHA}/" \
                -e "s/PLACEHOLDER_X64_SHA256/${DMG_X64_SHA}/" \
                chibby/packaging/homebrew/chibby.rb > tap/Casks/chibby.rb
          else
            echo "::warning::DMG assets not found for $TAG — cask left unchanged."
          fi

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No formula changes to commit."
          else
            git commit -m "chibby ${VERSION}"
            git push
          fi
